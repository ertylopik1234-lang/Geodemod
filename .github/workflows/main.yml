name: Build GD StreamChat Android

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build Geode mod for Android ARM64
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          target: Android64
          sdk: latest

      - name: Upload compiled GEODE
        uses: actions/upload-artifact@v4
        with:
          name: GD-StreamChat-Android64
          path: ${{ steps.build.outputs.build-output }}/*.geode
          if-no-files-found: error
          
