name: Build GD StreamChat (Android ARM64)

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Android ARM64 Geode mod
        uses: geode-sdk/build-geode-mod@main
        with:
          target: Android64
      - name: Upload .geode artifact
        uses: actions/upload-artifact@v4
        with:
          name: GD-StreamChat-Android64
          path: output/*.geode
          if-no-files-found: error
